[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "licensepdet"
version = "0.1.0"
description = "Thai license plate recognition from CCTV (YOLO + DeepSORT)"
requires-python = ">=3.10"
dependencies = [
    "ultralytics",
    "opencv-python",
    "numpy",
    "pillow",
    "python-dotenv",
    "deep-sort-realtime",
    "setuptools<81",  # deep-sort-realtime imports pkg_resources, removed in newer setuptools
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lpr = "lpr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
